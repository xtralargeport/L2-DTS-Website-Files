<!DOCTYPE html>
<html lang="en">
        <head>
        <!--Page Info (Favicon, Stylesheet, Title etc)-->
        <link rel="icon" type="image/x-icon" href="Images/logo.png">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Home Page for Pitch & Pavilion Cricket Website">
	    <meta name="keywords" content="Pitch & Pavilion, Cricket, Sports, Batting, Bowling">
        <link rel="stylesheet" href="stylesheetV11.css">
        <title>Pitch & Pavilion - Contact Us</title>
    </head>
    <body>
        <header>
            <!--NavBar-->
            <nav>
                <ul class="nav-left">
                    <!-- Logo Top Left + Link-->
                    <li class="nav-bar-logo">
                        <a href="index.html"><img src="Images/logo.png" alt="Logo Image"></a>
                    </li>
                </ul>
                <ul class="nav-right">
                    <!-- Menu Buttons-->
                    <li><a href="javascript:void(0)" onclick="openNav()"><div class="menu-icon">&#9776;</div></a></li>
                    <li><a href="javascript:void(0)" onclick="openCart()"><div class="cart-icon">&#128722;</div></a></li>
                </ul>
            </nav>
            <div id="main">
                <!-- Close Icon in Menu Sidenav-->
                <div id="mySidenav" class="sidenav">
                    <div class="closeIcon"><a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a></div>
                        <!-- Sidenav Links -->
                        <a href="index.html"><h1>Home</h1></a>
                        <a href="rules.html"><h1>Rules</h1></a>
                        <a href="gear.html"><h1>Gear</h1></a>
                        <a href="wheretoplay.html"><h1>Where to Play</h1></a>
                        <a href="coaching.html"><h1>Coaching</h1></a>
                        <a href="practicingtips.html"><h1>Practicing Tips</h1></a>
                        <a href="contacts.html"><h1>Contact Us</h1></a>
                    </div>
                    <!-- Close Icon in Cart Sidenav-->
                    <div id="mySideNavCart" class="sidenav">
                        <div class="closeIcon"><a href="javascript:void(0)" class="closebtn" onclick="closeCart()">&times;</a></div>
                        <h1 class="cart-title">Your Cart</h1>
                        <!-- Cart items get injected here by JS -->
                        <div id="cartItems" class="cart-items"></div>
                        <div class="cart-footer">
                            <p class="cart-total">Total: <span id="cartTotal">$0.00</span></p>
                            <button class="checkout-btn" onclick="checkout()">Checkout</button>
                        </div>
                    </div>                                                     
                </div>
                <script>
                    function openNav() {
                        document.getElementById("mySidenav").style.width = "15.625rem";
                        document.getElementById("main").style.marginRight = "15.625rem";
                    }

                    function closeNav() {
                        document.getElementById("mySidenav").style.width = "0";
                        document.getElementById("main").style.marginRight = "0";
                    }
                            
                    function openCart() {
                        document.getElementById("mySideNavCart").style.width = "15.625rem";
                        document.getElementById("main").style.marginRight = "15.625rem";
                    }

                    function closeCart() {
                        document.getElementById("mySideNavCart").style.width = "0";
                        document.getElementById("main").style.marginRight = "0";
                    }

                    let cart = [];

                    function addToCart(name, price, image = "") {
                        const existing = cart.find(item => item.name === name);
                        if (existing) {
                            existing.qty++;
                        } else {
                            cart.push({ name, price, qty: 1, image });
                        }
                        renderCart();
                        openCart();
                    }

                    function removeFromCart(index) {
                        cart.splice(index, 1);
                        renderCart();
                    }

                    function changeQty(index, delta) {
                        cart[index].qty += delta;
                        if (cart[index].qty <= 0) {
                            cart.splice(index, 1);
                        }
                        renderCart();
                    }

                    function renderCart() {
                        const cartItemsDiv = document.getElementById("cartItems");
                        const cartTotalSpan = document.getElementById("cartTotal");

                        if (cart.length === 0) {
                            cartItemsDiv.innerHTML = `<p class="cart-empty">Your cart is empty.</p>`;
                            cartTotalSpan.textContent = "$0.00";
                            return;
                        }

                        let html = "";
                        let total = 0;

                        cart.forEach((item, index) => {
                            const lineTotal = item.price * item.qty;
                            total += lineTotal;

                            html += `
                                <div class="cart-item">
                                    ${item.image ? `<img src="${item.image}" alt="${item.name}" class="cart-item-img">` : ""}
                                    <div class="cart-item-info">
                                        <p class="cart-item-name">${item.name}</p>
                                        <p class="cart-item-price">$${item.price.toFixed(2)}</p>
                                        <div class="cart-qty-controls">
                                            <button onclick="changeQty(${index}, -1)">&minus;</button>
                                            <span>${item.qty}</span>
                                            <button onclick="changeQty(${index}, 1)">&plus;</button>
                                        </div>
                                    </div>
                                    <button class="cart-remove-btn" onclick="removeFromCart(${index})">&times;</button>
                                </div>
                            `;
                        });

                        cartItemsDiv.innerHTML = html;
                        cartTotalSpan.textContent = `$${total.toFixed(2)}`;
                    }

                    function checkout() {
                        if (cart.length === 0) {
                            alert("Your cart is empty!");
                            return;
                        }
                        alert("Proceeding to checkout — total: " + document.getElementById("cartTotal").textContent);
                    }
                </script>
            </div>
        </header>
        <main class="contact-page">
            <form action="https://formspree.io/f/xyeygqqw" method="POST">
                <h1>Contact Us</h1>
                <p>We would love to hear from you! Please fill out the form below and we will get back to you as soon as possible.</p>
                <input type="text" name="first" placeholder="First Name" autocomplete="off" required>
                <input type="text" name="last" placeholder="Last Name" autocomplete="off" required>
                <input type="email" name="email" placeholder="Email Address" autocomplete="off" required>
                <textarea rows="5" cols="60" name="message" placeholder="Enter Text" autocomplete="off" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </main>
    </body>
</html>
